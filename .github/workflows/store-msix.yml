name: Build Microsoft Store packages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/store-msix.yml
      - '**/*.c'
      - '**/*.go'
      - '**/*.h'
      - '**/*.rc'
      - packaging/**
      - scripts/Build-WireRouteStorePackage.ps1
      - scripts/Generate-WireRouteStoreAssets.ps1
      - scripts/Test-WireRouteStorePackage.ps1
      - src/**
      - ui/icon/**
      - build.bat
      - go.mod
      - go.sum
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/store-msix.yml
      - '**/*.c'
      - '**/*.go'
      - '**/*.h'
      - '**/*.rc'
      - packaging/**
      - scripts/Build-WireRouteStorePackage.ps1
      - scripts/Generate-WireRouteStoreAssets.ps1
      - scripts/Test-WireRouteStorePackage.ps1
      - src/**
      - ui/icon/**
      - build.bat
      - go.mod
      - go.sum
  workflow_dispatch:

concurrency:
  group: wireroute-store-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  STORE_VERSION: 1.1.1.0

jobs:
  package:
    name: Build x64 and ARM64 MSIX
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare native resources and backends
        shell: pwsh
        run: |
          & .\build.bat
          if ($LASTEXITCODE -ne 0) {
              throw "build.bat failed with exit code $LASTEXITCODE."
          }

      - name: Build and validate Store packages
        shell: pwsh
        run: .\scripts\Build-WireRouteStorePackage.ps1 -Version $env:STORE_VERSION

      - name: Upload unsigned development packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WireRoute-Store-development-${{ github.sha }}
          path: |
            installer/dist/store/${{ env.STORE_VERSION }}/development/x64/**/WireRoute.Store_*_x64.msix
            installer/dist/store/${{ env.STORE_VERSION }}/development/x64/**/WireRoute.Store_*_x64.appxsym
            installer/dist/store/${{ env.STORE_VERSION }}/development/ARM64/**/WireRoute.Store_*_ARM64.msix
            installer/dist/store/${{ env.STORE_VERSION }}/development/ARM64/**/WireRoute.Store_*_ARM64.appxsym
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
